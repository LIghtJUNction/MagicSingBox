name: Apply reviewed routing update
on:
  push:
    branches: [fix/routing-lmm-best-20261008]
    paths: [.github/workflows/routing-maintenance-20261008.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/routing-lmm-best-20261008
          persist-credentials: false
      - name: Prove the new regressions detect the old policy
        run: |
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_routing_policy.py')
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          assert result.testsRun == 8, result.testsRun
          assert result.failures and not result.errors, 'Expected assertion failures, not test infrastructure errors'
          PY
      - name: Update the canonical source without reformatting unrelated content
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('config.source.json')
          text = path.read_text(encoding='utf-8')
          def replace(old, new):
              global text
              assert text.count(old) == 1, (old, text.count(old))
              text = text.replace(old, new, 1)
          replace('      {"protocol": "icmp", "server": "doh-google"},',
                  '      {"domain_suffix": ["lmm.best"], "server": "doh-cloudflare"},\n'
                  '      {"protocol": "icmp", "server": "doh-google"},')
          replace('      {"clash_mode": "Direct", "outbound": "direct"},',
                  '      {"domain_suffix": ["lmm.best"], "outbound": "proxy"},\n'
                  '      {"clash_mode": "Direct", "outbound": "direct"},')
          for key, target in (('server', 'doh-google'), ('outbound', 'ai-proxy')):
              replace(f'      {{"rule_set": ["meta-category-ai-!cn"], "{key}": "{target}"}},\n', '')
          dev_old = '"meta-huggingface", "meta-gitlab", "meta-docker", "meta-npmjs", "meta-category-dev"'
          assert text.count(dev_old) == 2
          text = text.replace(dev_old, '"meta-huggingface", "meta-gitlab", "meta-docker", "meta-npmjs"')
          social_tags = ['meta-notion', 'meta-slack', 'meta-reddit', 'meta-category-social-media-!cn']
          for key, direct, ai, social, dev in (
              ('server', 'bootstrap-local-dns', 'doh-google', 'doh-google', 'doh-google'),
              ('outbound', 'cn-direct', 'ai-proxy', 'social-proxy', 'dev-proxy'),
          ):
              old_social = ('      {\n        "rule_set": [\n'
                  '          "meta-notion",\n          "meta-slack",\n          "meta-reddit",\n'
                  '          "meta-category-social-media-!cn",\n          "meta-category-communication"\n'
                  f'        ],\n        "{key}": "{social}"\n      }},')
              replace(old_social, f'      {{"rule_set": ["meta-category-communication"], "{key}": "{social}"}},')
              old_cn = f'      {{"domain_suffix": ["cn", "中国", "公司", "网络"], "{key}": "{direct}"}},'
              labels = ['cn'] + [label.encode('idna').decode('ascii') for label in ('中国', '公司', '网络')]
              prefix = f'      {{"rule_set": ["meta-category-ai-!cn"], "{key}": "{ai}"}},\n'
              prefix += f'      {{"rule_set": {json.dumps(social_tags)}, "{key}": "{social}"}},\n'
              prefix += f'      {{"domain_suffix": {json.dumps(labels)}, "{key}": "{direct}"}},'
              replace(old_cn, prefix)
              media = ('      {\n        "rule_set": ["meta-category-media", "meta-category-entertainment"],\n'
                       f'        "{key}": "' + ('doh-google' if key == 'server' else 'media-proxy') + '"\n      },')
              replace(media, f'      {{"rule_set": ["meta-category-dev"], "{key}": "{dev}"}},\n' + media)
          json.loads(text)
          path.write_text(text, encoding='utf-8')
          PY
          python3 generate.py
          python3 generate.py --check
          python3 -m unittest discover -s tests -v
          git diff --check
          sha256sum config.json
      - name: Commit only the reviewed configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.source.json config.json
          git commit -m 'fix: require LMM proxy routing and refine domain classification priority'
          git push origin HEAD:refs/heads/fix/routing-lmm-best-20261008
